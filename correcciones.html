<h1>Correcciones</h1>
  <p>Aquí dejamos constancia de las correcciones que hacemos a notas ya publicadas. Si detectas un error, escríbenos a <a href="mailto:sesionesenelensayo@gmail.com">sesionesenelensayo@gmail.com</a> con el enlace de la nota y lo que debería decir.</p>
  <div id="registro"><p><em>Todavía no hemos registrado correcciones públicas.</em></p></div>
  <script>
  fetch('/data/correcciones.json?_='+Date.now()).then(function(r){return r.json()}).then(function(l){
    if(!l||!l.length)return; var h='';
    l.slice().reverse().forEach(function(c){h+='<h2>'+String(c.fecha||'').replace(/[<>&]/g,'')+'</h2><p><a href="'+String(c.url||'#').replace(/"/g,'')+'">'+String(c.titulo||'Nota').replace(/[<>&]/g,'')+'</a><br>'+String(c.cambio||'').replace(/[<>&]/g,'')+'</p>';});
    document.getElementById('registro').innerHTML=h;}).catch(function(){});
  </script>
  <p><a href="/como-trabajamos.html">Cómo trabajamos</a> · <a href="/">← Volver al sitio</a></p>
</body>
